<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio controller</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> audio controllers</h1>
    <audio src="airport.mp3" controls id="airport-audio"></audio> <!--use controls to add the audio player-->
    <audio src="pop.mp3"  id="pop-audio"></audio>


<button id="play-Button">play audio</button> 
<button id="pause-Button">pause audio</button>
<button id="pop-button">pop</button>


<video src="stardust.mp4" id="my-video"></video>
<button id="play-pause-button">
            <img
              id="play-pause-img"
              src="https://img.icons8.com/ios-glyphs/30/play--v1.png"
              alt="Play Button"
              width="24"
              height="24"
              />
</body>
</html>
